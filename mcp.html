<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio MCP Tester</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --muted: #94a3b8;
      --text: #e2e8f0;
      --accent: #22c55e;
      --line: #334155;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top right, #1e293b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(920px, 100%);
      background: color-mix(in srgb, var(--panel) 92%, black 8%);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.28);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .endpoint-wrap {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .endpoint-label {
      color: var(--muted);
      font-size: 13px;
    }

    .endpoint-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type="text"] {
      flex: 1 1 520px;
      min-width: 260px;
      border: 1px solid var(--line);
      background: #0b1220;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.18);
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    button {
      border: 1px solid var(--line);
      background: #1f2937;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: 140ms ease;
    }

    button:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .accent {
      background: #14532d;
      border-color: #166534;
    }

    pre {
      margin: 0;
      background: #020617;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      min-height: 280px;
      max-height: 56vh;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      color: #cbd5e1;
    }

    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .ok {
      color: #4ade80;
    }

    .bad {
      color: #f87171;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Portfolio MCP Tester</h1>
    <p>Validates that this URL returns MCP JSON-RPC from a real server handler, not HTML.</p>

    <div class="endpoint-wrap">
      <div class="endpoint-label">MCP endpoint URL</div>
      <div class="endpoint-row">
        <input id="endpointInput" type="text" value="https://sandhosh.vercel.app/api/mcp" />
        <button id="btnUseLocal">Use /api/mcp</button>
        <button id="btnCopyUrl">Copy URL</button>
      </div>
    </div>

    <div class="row">
      <button id="btnHealth">Health Check (GET)</button>
      <button class="accent" id="btnInit">Initialize</button>
      <button id="btnTools">Tools List</button>
      <button id="btnProfile">Call portfolio_profile</button>
      <button id="btnProjects">Call portfolio_projects</button>
      <button id="btnContact">Call portfolio_contact</button>
      <button id="btnClear">Clear</button>
    </div>

    <pre id="output"></pre>
    <div class="hint" id="status"></div>
  </main>

  <script>
    const output = document.getElementById("output");
    const status = document.getElementById("status");
    const endpointInput = document.getElementById("endpointInput");

    function getEndpoint() {
      return endpointInput.value.trim();
    }

    function setStatus(message, ok) {
      status.textContent = message;
      status.className = ok ? "hint ok" : "hint bad";
    }

    function append(label, data) {
      const block = `\n=== ${label} ===\n${JSON.stringify(data, null, 2)}\n`;
      output.textContent += block;
      output.scrollTop = output.scrollHeight;
    }

    async function parseResponse(res) {
      const contentType = res.headers.get("content-type") || "";
      const text = await res.text();
      let data = text;

      try {
        data = JSON.parse(text);
      } catch {
        data = text;
      }

      const seemsHtml =
        contentType.toLowerCase().includes("text/html") ||
        (typeof data === "string" && data.trim().toLowerCase().startsWith("<!doctype html"));

      return { data, contentType, seemsHtml };
    }

    async function healthCheck() {
      const endpoint = getEndpoint();
      if (!endpoint) {
        setStatus("Enter endpoint URL first.", false);
        return;
      }

      try {
        const res = await fetch(endpoint, { method: "GET" });
        const parsed = await parseResponse(res);
        append("health (GET)", {
          status: res.status,
          contentType: parsed.contentType,
          body: parsed.data,
        });

        if (parsed.seemsHtml) {
          setStatus("Endpoint returned HTML. Use a real MCP API route, not a page route.", false);
          return;
        }

        setStatus("GET check passed: endpoint is reachable and not HTML.", res.ok);
      } catch (error) {
        append("health (GET) ERROR", String(error));
        setStatus("Health check failed. Verify domain and path.", false);
      }
    }

    async function rpc(method, params, id) {
      const endpoint = getEndpoint();
      if (!endpoint) {
        throw new Error("Missing endpoint URL");
      }

      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id, method, params }),
      });

      const parsed = await parseResponse(res);
      const data = parsed.data;

      if (parsed.seemsHtml) {
        throw new Error("Endpoint returned HTML instead of MCP JSON-RPC.");
      }

      if (!res.ok) {
        throw new Error(`HTTP ${res.status}: ${typeof data === "string" ? data : JSON.stringify(data)}`);
      }

      return data;
    }

    document.getElementById("btnHealth").addEventListener("click", () => {
      healthCheck();
    });

    document.getElementById("btnUseLocal").addEventListener("click", () => {
      endpointInput.value = `${window.location.origin}/api/mcp`;
      setStatus("Endpoint switched to current site /api/mcp.", true);
    });

    document.getElementById("btnCopyUrl").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(getEndpoint());
        setStatus("Endpoint URL copied.", true);
      } catch {
        setStatus("Could not copy URL. Copy it manually.", false);
      }
    });

    async function run(label, method, params, id = Date.now()) {
      try {
        const data = await rpc(method, params, id);
        append(label, data);
        setStatus("MCP endpoint responded with JSON successfully.", true);
      } catch (error) {
        append(`${label} ERROR`, String(error));
        setStatus("Request failed. If response is HTML, route is not wired to MCP handler.", false);
      }
    }

    document.getElementById("btnInit").addEventListener("click", () => {
      run("initialize", "initialize", {
        protocolVersion: "2024-11-05",
        capabilities: {},
        clientInfo: { name: "portfolio-mcp-tester", version: "1.0.0" },
      }, 1);
    });

    document.getElementById("btnTools").addEventListener("click", () => {
      run("tools/list", "tools/list", {}, 2);
    });

    document.getElementById("btnProfile").addEventListener("click", () => {
      run("tools/call portfolio_profile", "tools/call", {
        name: "portfolio_profile",
        arguments: {},
      }, 3);
    });

    document.getElementById("btnProjects").addEventListener("click", () => {
      run("tools/call portfolio_projects", "tools/call", {
        name: "portfolio_projects",
        arguments: { limit: 3 },
      }, 4);
    });

    document.getElementById("btnContact").addEventListener("click", () => {
      run("tools/call portfolio_contact", "tools/call", {
        name: "portfolio_contact",
        arguments: {},
      }, 5);
    });

    document.getElementById("btnClear").addEventListener("click", () => {
      output.textContent = "";
      setStatus("Output cleared.", true);
    });

    setStatus("Ready. Run Health Check, then Initialize.", true);
  </script>
</body>
</html>
